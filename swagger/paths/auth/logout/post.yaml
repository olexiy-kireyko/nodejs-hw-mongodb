tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'Logout user with cookies'

security:
  - cookieAuth: []

parameters:
  - in: cookie
    name: refreshToken
    required: true
    schema:
      type: string
      example: I8pFv8krW8u%2Bj2ZnpsNfRMADUQNCILbg0XLp2lvT

responses:
  '204':
    description: logout user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
              example: 204

  '401':
    $ref: '../../../components/responses/401.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
